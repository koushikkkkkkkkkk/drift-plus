name: Rust

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build
    - name: Run tests
      run: cargo test
    - name: Build release binary
      run: cargo build --release
    - uses: actions/upload-artifact@v7
      with:
        name: drift-plus-linux-x86_64
        path: target/release/drift
